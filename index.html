<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Singgah Cafe POS</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--tx:#2b1d12;--mu:#7a6a5c;--ac:#d9480f;--ok:#2b8a3e;--bd:#ecd9c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1511;--card:#2a201a;--tx:#f5e9dc;--mu:#b5a291;--ac:#ff8a4c;--ok:#69db7c;--bd:#4a3a2e;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 12px 90px;max-width:720px;margin:auto}
h2{margin:16px 0 8px;font-size:18px}h3{margin:12px 0 6px;font-size:15px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 2px;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
button{font:inherit;cursor:pointer}
.item{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:14px 6px;text-align:center}
.item b{display:block}.item span{color:var(--ac);font-weight:700}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.q{display:flex;align-items:center;gap:6px}
.sm{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;width:34px;height:34px;font-size:18px}
.big{flex:1;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:700;color:#fff}
.cash{background:var(--ok)}.qr{background:#1971c2}.ghost{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:6px 10px}
.danger{color:#e03131;border-color:#e03131}
input,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
input.n{width:80px}.tot{font-size:22px;font-weight:800}.mu{color:var(--mu);font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.stats b{display:block;font-size:19px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:10px 12px}summary{cursor:pointer;font-weight:700}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:20px;display:none;z-index:9}
.status-pill{font-size:11px;padding:3px 8px;border-radius:10px;background:#e9ecef;color:#495057}
.login-box{max-width:360px;margin:50px auto;background:var(--card);border:1px solid var(--bd);padding:24px;border-radius:16px}
</style></head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
  <h1 style="margin:0;font-size:22px;color:var(--ac)">🍔 Singgah Cafe</h1>
  <span id="syncStatus" class="status-pill">Offline</span>
</div>

<div id="app"></div>
<div id="toast"></div>
<nav id="nav" style="display:none"></nav>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
// --- FIREBASE CONFIGURATION ---
const firebaseConfig = {
  apiKey: "AIzaSyCze8lXYoPOVfTUIcYtv1T8xEFJ2VuJD8g",
  authDomain: "singgah-cafe.firebaseapp.com",
  projectId: "singgah-cafe",
  storageBucket: "singgah-cafe.firebasestorage.app",
  messagingSenderId: "530014104505",
  appId: "1:530014104505:web:a96937c99112e3ba8f6468"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const defaultData = {
  menu: [
    {id:'m1',name:'Chicken Burger',price:6},
    {id:'m2',name:'Beef Burger',price:7},
    {id:'m3',name:'Cheese Burger',price:8},
    {id:'m4',name:'Double Burger',price:11},
    {id:'m5',name:'Fries',price:4},
    {id:'m6',name:'Drink',price:3}
  ],
  orders: [],
  stock: []
};

let S = { ...defaultData };
let currentUser = null;
let unsubscribeFirestore = null;
let cart = {}, tab = 'order', selDay = null, armed = null;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const money = n => 'RM ' + (+n).toFixed(2);
const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const sum = l => { let cash=0,qr=0; l.forEach(o => o.pay=='cash'? cash+=o.total : qr+=o.total); return {cash, qr, all: cash+qr, n: l.length}; };

function toast(m){
  const t = $('toast');
  t.textContent = m;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 1400);
}

function setStatus(text, bg='#e9ecef', col='#495057'){
  const s = $('syncStatus');
  if(s){ s.textContent = text; s.style.background = bg; s.style.color = col; }
}

// Save to Firebase Cloud
async function save(){
  if(!currentUser) return;
  try {
    setStatus('Saving...', '#fff3bf', '#e67700');
    await db.collection('stall').doc('data').set(S);
    setStatus('Cloud Synced ✓', '#d3f9d8', '#2b8a3e');
  } catch(e) {
    console.error(e);
    setStatus('Save Error', '#ffe3e3', '#c92a2a');
    toast('Error saving to cloud');
  }
}

// Track login state
auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user){
    $('nav').style.display = 'flex';
    setStatus('Connecting...', '#fff3bf', '#e67700');
    // Start real-time sync with database
    unsubscribeFirestore = db.collection('stall').doc('data').onSnapshot(doc => {
      if(doc.exists){
        S = doc.data();
        S.menu = S.menu || [];
        S.orders = S.orders || [];
        S.stock = S.stock || [];
      } else {
        db.collection('stall').doc('data').set(defaultData);
        S = defaultData;
      }
      setStatus('Cloud Synced ✓', '#d3f9d8', '#2b8a3e');
      render();
    }, err => {
      console.error(err);
      setStatus('No Access', '#ffe3e3', '#c92a2a');
    });
  } else {
    // Logged out
    if(unsubscribeFirestore) unsubscribeFirestore();
    $('nav').style.display = 'none';
    setStatus('Logged Out', '#e9ecef', '#495057');
    renderLogin();
  }
});

function renderLogin(err=''){
  $('app').innerHTML = `
  <div class="login-box">
    <h2 style="margin-top:0">Staff Login</h2>
    <p class="mu">Sign in with your stall staff account to access orders and sales.</p>
    ${err ? `<p style="color:#e03131;font-size:14px">${esc(err)}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <input id="u_email" type="email" placeholder="Staff Email (e.g. staff@singgah.com)">
      <input id="u_pass" type="password" placeholder="Password">
      <button class="big" style="background:var(--ac);padding:12px;margin-top:8px" data-act="dologin">Log In</button>
    </div>
  </div>`;
}

function delBtn(k,id){
  return `<button class="ghost danger" data-act="del" data-k="${k}" data-id="${id}">${armed==k+id?'Tap again to confirm':'Delete'}</button>`;
}

function vOrder(){
 const m = S.menu, ids = Object.keys(cart).filter(i => m.find(x => x.id == i));
 let total = 0;
 const lines = ids.map(i => {
   const x = m.find(y => y.id == i);
   total += x.price * cart[i];
   return `<div class="row"><span>${esc(x.name)}<br><span class="mu">${money(x.price)}</span></span><span class="q"><button class="sm" data-act="dec" data-id="${i}">−</button><b>${cart[i]}</b><button class="sm" data-act="inc" data-id="${i}">+</button></span></div>`;
 }).join('');
 return `<h2>New order</h2>
 <div class="grid">${m.map(x=>`<button class="item" data-act="add" data-id="${x.id}"><b>${esc(x.name)}</b><span>${money(x.price)}</span></button>`).join('')||'<p class="mu">No menu items yet. Add some in Settings.</p>'}</div>
 <div class="card">${lines||'<span class="mu">Tap an item above to add it.</span>'}
 <div class="row"><span>Total</span><span class="tot">${money(total)}</span></div>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="big cash" data-act="pay" data-p="cash">Cash</button><button class="big qr" data-act="pay" data-p="qr">QR</button></div>
 <div style="margin-top:8px"><button class="ghost" data-act="clear">Clear order</button></div></div>`;
}

function vDay(k){
 const l = S.orders.filter(o => dkey(o.t) == k).sort((a,b) => b.t - a.t), s = sum(l), c = {};
 l.forEach(o => o.items.forEach(i => c[i.n] = (c[i.n] || 0) + i.q));
 return `<div class="stats"><div>Total sales<b>${money(s.all)}</b></div><div>Orders<b>${s.n}</b></div><div>Cash<b>${money(s.cash)}</b></div><div>QR<b>${money(s.qr)}</b></div></div>
 <h3>Items sold</h3><div class="card">${Object.keys(c).sort((a,b)=>c[b]-c[a]).map(n=>`<div class="row"><span>${esc(n)}</span><b>${c[n]}</b></div>`).join('')||'<span class="mu">Nothing yet.</span>'}</div>
 <h3>Orders</h3>${l.map(o=>`<div class="card"><div class="row"><b>${new Date(o.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${o.pay=='cash'?'Cash':'QR'}</b><b>${money(o.total)}</b></div><div class="mu">${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</div><div style="margin-top:6px">${delBtn('order',o.id)}</div></div>`).join('')||''}`;
}

function vToday(){ const k = dkey(Date.now()); return `<h2>Today <span class="mu">${k}</span></h2>` + vDay(k); }

function vHist(){
 if(selDay) return `<button class="ghost" data-act="back" style="margin-top:12px">← Back to history</button><h2>${selDay}</h2>` + vDay(selDay);
 const months = {}; S.orders.forEach(o => { const d = dkey(o.t); (months[d.slice(0,7)] = months[d.slice(0,7)] || {})[d] = 1; });
 const yrs = {}; Object.keys(months).forEach(m => yrs[m.slice(0,4)] = 1);
 let h = '<h2>Sales history</h2>';
 if(!S.orders.length) return h + '<p class="mu">No sales recorded yet.</p>';
 Object.keys(yrs).sort().reverse().forEach(y => {
  const ys = sum(S.orders.filter(o => dkey(o.t).slice(0,4) == y));
  h += `<div class="card"><b>Year ${y}</b><div class="mu">${ys.n} orders · Cash ${money(ys.cash)} · QR ${money(ys.qr)}</div><div class="tot">${money(ys.all)}</div></div>`;
  Object.keys(months).filter(m => m.startsWith(y)).sort().reverse().forEach(m => {
   const ms = sum(S.orders.filter(o => dkey(o.t).slice(0,7) == m));
   h += `<details><summary>${m} — ${money(ms.all)}</summary><div class="mu">${ms.n} orders · Cash ${money(ms.cash)} · QR ${money(ms.qr)}</div>` +
   Object.keys(months[m]).sort().reverse().map(d => { const ds = sum(S.orders.filter(o => dkey(o.t) == d)); return `<div class="row"><button class="ghost" data-act="day" data-id="${d}">${d}</button><span>${ds.n} orders · <b>${money(ds.all)}</b></span></div>`; }).join('') + '</details>';
  });
 });
 return h;
}

function vStock(){
 return `<h2>Ingredient stock</h2>${S.stock.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b>${delBtn('stock',s.id)}</div><div class="q" style="margin-top:6px"><button class="sm" data-act="sadj" data-id="${s.id}" data-d="-1">−</button><input class="n" type="number" inputmode="decimal" value="${s.qty}" data-ch="sq" data-id="${s.id}"><button class="sm" data-act="sadj" data-id="${s.id}" data-d="1">+</button><span class="mu">${esc(s.unit||'')}</span></div></div>`).join('')||'<p class="mu">No stock items yet. Add your first below.</p>'}
 <div class="card"><b>Add ingredient</b><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><input id="sn" placeholder="Name (e.g. Buns)" style="flex:2 1 140px"><input id="sq" class="n" type="number" inputmode="decimal" placeholder="Qty"><input id="su" placeholder="Unit (pcs, kg)" style="width:110px"></div><button class="ghost" data-act="addstock" style="margin-top:8px">Add</button></div>`;
}

function vSet(){
 return `<h2>Menu &amp; prices</h2>${S.menu.map(x=>`<div class="card"><div class="row"><input value="${esc(x.name)}" data-ch="mn" data-id="${x.id}" style="flex:1"><input class="n" type="number" step="0.1" inputmode="decimal" value="${x.price}" data-ch="mp" data-id="${x.id}">${delBtn('menu',x.id)}</div></div>`).join('')}
 <div class="card"><b>Add menu item</b><div style="display:flex;gap:6px;margin-top:6px"><input id="mn" placeholder="Name" style="flex:1"><input id="mp" class="n" type="number" step="0.1" inputmode="decimal" placeholder="Price"></div><button class="ghost" data-act="addmenu" style="margin-top:8px">Add</button></div>
 <h2>Account</h2><p class="mu">Logged in as: <b>${esc(currentUser ? currentUser.email : '')}</b></p>
 <button class="ghost danger" data-act="logout">Log Out</button>
 <h2>Backup</h2><p class="mu">Data is securely saved in Google Firebase. You can also copy a local raw backup text below:</p>
 <textarea id="bk" rows="4" style="width:100%">${esc(JSON.stringify(S))}</textarea>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="ghost" data-act="copy">Copy backup</button><button class="ghost" data-act="restore">Restore</button></div>`;
}

function render(){
 if(!currentUser) return;
 const T = [['order','Order'],['today','Today'],['hist','History'],['stock','Stock'],['set','Settings']];
 $('nav').innerHTML = T.map(t => `<button class="${tab==t[0]?'on':''}" data-act="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
 $('app').innerHTML = {order:vOrder, today:vToday, hist:vHist, stock:vStock, set:vSet}[tab]();
}

document.addEventListener('click', async e => {
 const b = e.target.closest('[data-act]'); if(!b) return;
 const a = b.dataset.act, id = b.dataset.id;

 if(a=='dologin'){
   const em = $('u_email').value.trim();
   const pw = $('u_pass').value;
   if(!em || !pw) return renderLogin('Please enter both email and password.');
   try {
     await auth.signInWithEmailAndPassword(em, pw);
   } catch(err) {
     renderLogin(err.message || 'Login failed. Check email or password.');
   }
   return;
 }
 if(a=='logout'){
   await auth.signOut();
   return;
 }
 if(a=='tab'){ tab = b.dataset.t; selDay = null; armed = null; }
 else if(a=='add') cart[id] = (cart[id] || 0) + 1;
 else if(a=='inc') cart[id]++;
 else if(a=='dec'){ if(--cart[id] <= 0) delete cart[id]; }
 else if(a=='clear') cart = {};
 else if(a=='pay'){
  const items = Object.keys(cart).map(i => { const x = S.menu.find(y => y.id == i); return x && {n: x.name, p: x.price, q: cart[i]}; }).filter(Boolean);
  if(!items.length){ toast('Add items first'); return; }
  S.orders.push({id: uid(), t: Date.now(), items, total: items.reduce((s,i) => s + i.p*i.q, 0), pay: b.dataset.p});
  cart = {}; save(); toast('Order saved');
 }
 else if(a=='day') selDay = id;
 else if(a=='back') selDay = null;
 else if(a=='del'){
  const k = b.dataset.k;
  if(armed != k+id){ armed = k+id; render(); return; }
  armed = null;
  if(k=='order') S.orders = S.orders.filter(o => o.id != id);
  if(k=='stock') S.stock = S.stock.filter(o => o.id != id);
  if(k=='menu'){ S.menu = S.menu.filter(o => o.id != id); delete cart[id]; }
  save();
 }
 else if(a=='sadj'){ const s = S.stock.find(x => x.id == id); s.qty = Math.max(0, +((+s.qty || 0) + +b.dataset.d).toFixed(2)); save(); }
 else if(a=='addstock'){ const n = $('sn').value.trim(); if(!n) return; S.stock.push({id: uid(), name: n, qty: +$('sq').value || 0, unit: $('su').value.trim()}); save(); }
 else if(a=='addmenu'){ const n = $('mn').value.trim(), p = parseFloat($('mp').value); if(!n || isNaN(p)) return toast('Enter name and price'); S.menu.push({id: uid(), name: n, price: p}); save(); }
 else if(a=='copy'){ const t = $('bk'); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>toast('Select all and copy')); }catch(x){ toast('Select all and copy'); } return; }
 else if(a=='restore'){ try{ const d = JSON.parse($('bk').value); if(!Array.isArray(d.menu)||!Array.isArray(d.orders)||!Array.isArray(d.stock)) throw 0; S = d; save(); toast('Restored'); }catch(x){ toast('Backup text not valid'); return; } }
 render(); window.scrollTo(0, a=='tab'? 0 : scrollY);
});

document.addEventListener('change', e => {
 const t = e.target, c = t.dataset.ch; if(!c) return;
 const id = t.dataset.id;
 if(c=='sq'){ const s = S.stock.find(x => x.id == id); s.qty = Math.max(0, +t.value || 0); }
 if(c=='mn'){ const m = S.menu.find(x => x.id == id); if(t.value.trim()) m.name = t.value.trim(); }
 if(c=='mp'){ const m = S.menu.find(x => x.id == id); const p = parseFloat(t.value); if(!isNaN(p)) m.price = p; }
 save();
});
</script>
</body>
</html>
